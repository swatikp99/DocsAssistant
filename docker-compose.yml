services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docs-assistant-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgdocs}
      POSTGRES_DB: ${POSTGRES_DB:-docsassistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgdocs}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  ollama:
    image: ollama/ollama:latest
    container_name: docs-assistant-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data: