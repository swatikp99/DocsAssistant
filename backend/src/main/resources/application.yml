spring:
  application:
    name: docs-assistant

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docsassistant}
    username: ${DB_USERNAME:pgdocs}
    password: ${DB_PASSWORD:pgdocs}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

# Application specific settings
app:
  # Comma separated list of origins allowed to call /api/*
  cors:
    allowed-origins: http://localhost:5173
  storage:
    # Root folder on the local filesystem where uploaded files are stored.
    root: ${STORAGE_ROOT:./data/uploads}
  ingestion:
    # chunk-size = target words per chunk; chunk-overlap = shared words between neighbouring chunks.
    chunk-size: ${CHUNK_SIZE:375}
    chunk-overlap: ${CHUNK_OVERLAP:60}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      # Vector size produced by the embedding model; must match the pgvector chunks.embedding column
      embedding-dimensions: ${OLLAMA_EMBEDDING_DIMENSIONS:768}

management:
  endpoints:
    web:
      exposure:
        exclude: health,info